apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knotree-api.fullname" . }}
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "knotree-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "knotree-api.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "knotree-api.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "knotree-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.databaseUrlKey }}
            - name: BIND_ADDR
              value: {{ printf "0.0.0.0:%d" (int .Values.service.port) | quote }}
            - name: APP_ENV
              value: {{ .Values.env.appEnv | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.env.corsAllowedOrigins | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.env.cookieSecure | quote }}
            - name: AUTH_REQUIRE_EMAIL_VERIFICATION
              value: {{ .Values.env.authRequireEmailVerification | quote }}
            - name: SESSION_TTL_DAYS
              value: {{ .Values.env.sessionTtlDays | quote }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.env.databaseMaxConnections | quote }}
            - name: RUST_LOG
              value: {{ .Values.env.rustLog | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
