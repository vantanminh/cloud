apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knotree-api.fullname" . }}
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "knotree-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "knotree-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "knotree-api.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "knotree-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: 1m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          command:
            - /usr/local/bin/knotree-api
            - migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.databaseUrlKey }}
            - name: DATABASE_CREDENTIALS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.databaseCredentialsEncryptionKey }}
                  optional: true
            - name: APP_ENV
              value: {{ .Values.env.appEnv | quote }}
            - name: RUST_LOG
              value: {{ .Values.env.rustLog | quote }}
      containers:
        - name: api
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "knotree-api.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.databaseUrlKey }}
            - name: BIND_ADDR
              value: {{ printf "0.0.0.0:%d" (int .Values.service.port) | quote }}
            - name: APP_ENV
              value: {{ .Values.env.appEnv | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.env.corsAllowedOrigins | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.env.cookieSecure | quote }}
            - name: AUTH_REQUIRE_EMAIL_VERIFICATION
              value: {{ .Values.env.authRequireEmailVerification | quote }}
            - name: SESSION_TTL_DAYS
              value: {{ .Values.env.sessionTtlDays | quote }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.env.databaseMaxConnections | quote }}
            - name: DATABASE_PROVISIONING_ENABLED
              value: {{ .Values.env.databaseProvisioningEnabled | quote }}
            - name: DATABASE_RESOURCE_HOST
              value: {{ .Values.env.databaseResourceHost | quote }}
            - name: DATABASE_RESOURCE_PORT
              value: {{ .Values.env.databaseResourcePort | quote }}
            - name: DATABASE_RESOURCE_PUBLIC_HOST
              value: {{ .Values.env.databaseResourcePublicHost | quote }}
            - name: DATABASE_RESOURCE_PUBLIC_PORT
              value: {{ .Values.env.databaseResourcePublicPort | quote }}
            - name: DATABASE_CLUSTER_PROVIDER
              value: {{ .Values.env.databaseClusterProvider | quote }}
            - name: DATABASE_CLUSTER_IMAGE
              value: {{ .Values.env.databaseClusterImage | quote }}
            - name: DATABASE_CLUSTER_NAMESPACE
              value: {{ .Values.env.databaseClusterNamespace | quote }}
            - name: DATABASE_CLUSTER_SERVICE_TYPE
              value: {{ .Values.env.databaseClusterServiceType | quote }}
            - name: DATABASE_CLUSTER_STORAGE_SIZE
              value: {{ .Values.env.databaseClusterStorageSize | quote }}
            - name: DATABASE_CLUSTER_STARTUP_TIMEOUT_SECONDS
              value: {{ .Values.env.databaseClusterStartupTimeoutSeconds | quote }}
            - name: DATABASE_QUERY_TIMEOUT_MS
              value: {{ .Values.env.databaseQueryTimeoutMs | quote }}
            - name: DATABASE_QUERY_MAX_ROWS
              value: {{ .Values.env.databaseQueryMaxRows | quote }}
            - name: APP_SERVICE_PROVISIONING_ENABLED
              value: {{ .Values.env.appServiceProvisioningEnabled | quote }}
            - name: APP_SERVICE_PUBLIC_HOST
              value: {{ .Values.env.appServicePublicHost | quote }}
            - name: APP_SERVICE_PUBLIC_DOMAIN
              value: {{ .Values.env.appServicePublicDomain | quote }}
            - name: APP_SERVICE_PUBLIC_SCHEME
              value: {{ .Values.env.appServicePublicScheme | quote }}
            - name: APP_SERVICE_BIND_ADDRESS
              value: {{ .Values.env.appServiceBindAddress | quote }}
            - name: GITHUB_OAUTH_REDIRECT_URI
              value: {{ .Values.env.githubOAuthRedirectUri | quote }}
            - name: KONG_ADMIN_URL
              value: {{ if .Values.env.kongAdminUrl }}{{ .Values.env.kongAdminUrl | quote }}{{ else }}{{ printf "http://%s-apps-kong:%d" (include "knotree-api.fullname" .) (int .Values.appsKong.adminPort) | quote }}{{ end }}
            - name: KONG_TRAFFIC_LOG_ENDPOINT
              {{ if and .Values.env.appServicePublicDomain .Values.appsKong.enabled }}
              value: {{ printf "http://%s:%d/internal/public-traffic" (include "knotree-api.fullname" .) (int .Values.service.port) | quote }}
              {{ else }}
              value: ""
              {{ end }}
            - name: KONG_TRAFFIC_LOG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: KONG_TRAFFIC_LOG_TOKEN
                  optional: true
            - name: MCP_PUBLIC_BASE_URL
              value: {{ .Values.env.mcpPublicBaseUrl | quote }}
            - name: MCP_ACCESS_TTL_SECONDS
              value: {{ .Values.env.mcpAccessTtlSeconds | quote }}
            - name: MCP_REFRESH_TTL_SECONDS
              value: {{ .Values.env.mcpRefreshTtlSeconds | quote }}
            - name: REDIS_CLUSTER_IMAGE
              value: {{ .Values.env.redisClusterImage | quote }}
            - name: APP_SERVICE_IMAGE_PULL_SECRET
              value: {{ .Values.env.appServiceImagePullSecret | quote }}
            - name: APP_SERVICE_DEFAULT_RATE_LIMIT_RPM
              value: {{ .Values.env.appServiceDefaultRateLimitRpm | quote }}
            - name: HTML_SITE_DATA_DIR
              value: {{ .Values.env.htmlSiteDataDir | quote }}
            - name: HTML_NGINX_IMAGE
              value: {{ .Values.env.htmlNginxImage | quote }}
            - name: KNOTREE_DOCS_DIR
              value: /usr/share/knotree/docs
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_CREDENTIALS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.databaseCredentialsEncryptionKey }}
                  optional: true
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.githubClientIdKey }}
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.githubClientSecretKey }}
                  optional: true
            - name: RUST_LOG
              value: {{ .Values.env.rustLog | quote }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: html-sites
              mountPath: {{ .Values.env.htmlSiteDataDir | quote }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: html-sites
          hostPath:
            path: {{ .Values.env.htmlSiteDataDir | quote }}
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
