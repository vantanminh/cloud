{{- if eq .Values.env.databaseClusterProvider "kubernetes" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "knotree-api.fullname" . }}-node-metrics
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "knotree-api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "knotree-api.fullname" . }}-node-metrics
{{- end }}
