apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "knotree-api.fullname" . }}-tenant-caps
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      max:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 10Gi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 10Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 256Mi
    - type: PersistentVolumeClaim
      max:
        storage: 10Gi
