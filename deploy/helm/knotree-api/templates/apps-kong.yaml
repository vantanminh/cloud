{{- if .Values.appsKong.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "knotree-api.fullname" . }}-apps-kong
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    services: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "knotree-api.fullname" . }}-apps-kong
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: apps-kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "knotree-api.name" . }}-apps-kong
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "knotree-api.name" . }}-apps-kong
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ include "knotree-api.name" . }}-apps-kong
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: apps-kong
    spec:
      containers:
        - name: kong
          image: {{ .Values.appsKong.image | quote }}
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_ROLE
              value: traditional
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:{{ .Values.appsKong.proxyPort }}
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:{{ .Values.appsKong.adminPort }}
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "2"
            - name: KONG_LOG_LEVEL
              value: notice
          ports:
            - name: proxy
              containerPort: {{ .Values.appsKong.proxyPort }}
            - name: admin
              containerPort: {{ .Values.appsKong.adminPort }}
          volumeMounts:
            - name: config
              mountPath: /kong
          readinessProbe:
            httpGet:
              path: /status
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: {{ include "knotree-api.fullname" . }}-apps-kong
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "knotree-api.fullname" . }}-apps-kong
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: proxy
      port: {{ .Values.appsKong.proxyPort }}
      targetPort: proxy
    - name: admin
      port: {{ .Values.appsKong.adminPort }}
      targetPort: admin
  selector:
    app.kubernetes.io/name: {{ include "knotree-api.name" . }}-apps-kong
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
