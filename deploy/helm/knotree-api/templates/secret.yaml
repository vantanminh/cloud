{{- $secretName := .Values.secrets.existingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if not $existing }}
{{- $pgPassword := randAlphaNum 32 }}
{{- $encKey := randAlphaNum 32 | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-pg:5432/%s" .Values.controlPlaneDatabase.user $pgPassword (include "knotree-api.fullname" .) .Values.controlPlaneDatabase.database | quote }}
  DATABASE_CREDENTIALS_ENCRYPTION_KEY: {{ $encKey | quote }}
{{- end }}
