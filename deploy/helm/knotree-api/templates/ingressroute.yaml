{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "knotree-api.fullname" . }}
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && (PathPrefix(`/api`) || PathPrefix(`/healthz`) || PathPrefix(`/readyz`) || PathPrefix(`/oauth`) || PathPrefix(`/mcp`) || PathPrefix(`/.well-known`))
      kind: Rule
      priority: 1000
      services:
        - name: {{ include "knotree-api.fullname" . }}
          port: {{ .Values.service.port }}
{{- if .Values.ingress.apiHost }}
    - match: Host(`{{ .Values.ingress.apiHost }}`)
      kind: Rule
      services:
        - name: {{ include "knotree-api.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
{{- if .Values.web.enabled }}
    - match: Host(`{{ .Values.web.ingress.host }}`)
      kind: Rule
      priority: 1000
      services:
        - name: {{ include "knotree-api.fullname" . }}-web
          port: {{ .Values.web.service.port }}
{{- end }}
{{- if .Values.env.appServicePublicDomain }}
    - match: Host(`img.{{ .Values.env.appServicePublicDomain }}`) && PathPrefix(`/images/`)
      kind: Rule
      priority: 100
      services:
        - name: {{ include "knotree-api.fullname" . }}
          port: {{ .Values.service.port }}
    - match: HostRegexp(`^page-.+\.{{ .Values.env.appServicePublicDomain | replace "." "\\." }}$`) && PathPrefix(`/api/v1/public/html-pages/`)
      kind: Rule
      priority: 50
      services:
        - name: {{ include "knotree-api.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
{{ if and .Values.env.appServicePublicDomain .Values.appsKong.enabled }}
    - match: HostRegexp(`^page-.+\.{{ .Values.env.appServicePublicDomain | replace "." "\\." }}$`)
      kind: Rule
      priority: 40
      services:
        - name: {{ include "knotree-api.fullname" . }}-apps-kong
          port: {{ .Values.appsKong.proxyPort }}
    - match: HostRegexp(`^.+\.{{ .Values.env.appServicePublicDomain | replace "." "\\." }}$`)
      kind: Rule
      services:
        - name: {{ include "knotree-api.fullname" . }}-apps-kong
          port: {{ .Values.appsKong.proxyPort }}
{{ else if .Values.env.appServicePublicDomain }}
    - match: HostRegexp(`^page-.+\.{{ .Values.env.appServicePublicDomain | replace "." "\\." }}$`)
      kind: Rule
      priority: 40
      services:
        - name: {{ include "knotree-api.fullname" . }}
          port: {{ .Values.service.port }}
    - match: HostRegexp(`^.+\.{{ .Values.env.appServicePublicDomain | replace "." "\\." }}$`)
      kind: Rule
      services:
        - name: {{ include "knotree-api.fullname" . }}
          port: {{ .Values.service.port }}
{{ end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
