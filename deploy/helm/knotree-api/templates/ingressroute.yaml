{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "knotree-api.fullname" . }}
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ include "knotree-api.fullname" . }}
          port: {{ .Values.service.port }}
{{ if .Values.env.appServicePublicDomain }}
    - match: HostRegexp(`^.+\.{{ .Values.env.appServicePublicDomain | replace "." "\\." }}$`)
      kind: Rule
      services:
        - name: {{ include "knotree-api.fullname" . }}
          port: {{ .Values.service.port }}
{{ end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
