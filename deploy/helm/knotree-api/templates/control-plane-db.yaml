{{- if .Values.controlPlaneDatabase.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "knotree-api.fullname" . }}-pg
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: {{ include "knotree-api.name" . }}-pg
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "knotree-api.fullname" . }}-pg
  labels:
    {{- include "knotree-api.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "knotree-api.fullname" . }}-pg
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "knotree-api.name" . }}-pg
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "knotree-api.name" . }}-pg
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.controlPlaneDatabase.image | quote }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.controlPlaneDatabase.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.controlPlaneDatabase.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.controlPlaneDatabase.user | quote }}]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.controlPlaneDatabase.storage }}
{{- end }}
