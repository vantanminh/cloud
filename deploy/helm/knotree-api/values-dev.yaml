replicaCount: 1

image:
  pullPolicy: IfNotPresent

ingress:
  enabled: false

certManager:
  enabled: false

env:
  appEnv: development
  corsAllowedOrigins: http://localhost:5173
  cookieSecure: "false"
  authRequireEmailVerification: "false"
  databaseProvisioningEnabled: "true"
  databaseClusterProvider: kubernetes
  databaseClusterServiceType: ClusterIP
  appServiceProvisioningEnabled: "false"
  rustLog: info,knotree_api=debug
