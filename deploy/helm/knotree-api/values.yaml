replicaCount: 1

image:
  repository: ghcr.io/vantanminh/cloud/api
  pullPolicy: IfNotPresent
  tag: ""

web:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/vantanminh/cloud/web
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 8080
  ingress:
    host: cloud.knotree.com

appsKong:
  enabled: true
  image: kong:3.9
  proxyPort: 8000
  adminPort: 8001

controlPlaneDatabase:
  enabled: true
  image: postgres:16-alpine
  storage: 10Gi
  user: knotree
  database: knotree_cloud

imagePullSecrets:
  - name: ghcr-cred
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  host: cloud.knotree.com
  apiHost: cloudapi.knotree.com
  entryPoints:
    - web
    - websecure
  tls:
    enabled: true
    secretName: cloudapi-knotree-com-tls

certManager:
  enabled: false
  clusterIssuer: letsencrypt-prod

secrets:
  existingSecret: knotree-api-secrets
  databaseUrlKey: DATABASE_URL
  databaseCredentialsEncryptionKey: DATABASE_CREDENTIALS_ENCRYPTION_KEY
  githubClientIdKey: GITHUB_CLIENT_ID
  githubClientSecretKey: GITHUB_CLIENT_SECRET

env:
  appEnv: production
  corsAllowedOrigins: https://cloud.knotree.com
  cookieSecure: "true"
  authRequireEmailVerification: "true"
  sessionTtlDays: "30"
  databaseMaxConnections: "10"
  databaseProvisioningEnabled: "true"
  databaseResourceHost: ""
  databaseResourcePort: "5432"
  databaseResourcePublicHost: ""
  databaseResourcePublicPort: ""
  databaseClusterProvider: kubernetes
  databaseClusterImage: postgres:16-alpine
  databaseClusterNamespace: ""
  databaseClusterServiceType: ClusterIP
  databaseClusterStorageSize: 10Gi
  databaseClusterStartupTimeoutSeconds: "180"
  databaseQueryTimeoutMs: "10000"
  databaseQueryMaxRows: "500"
  appServiceProvisioningEnabled: "true"
  appServicePublicHost: ""
  appServicePublicDomain: knotree.org
  appServicePublicScheme: https
  appServiceBindAddress: "127.0.0.1"
  githubOAuthRedirectUri: https://cloud.knotree.com/api/v1/auth/github/callback
  kongAdminUrl: ""
  mcpPublicBaseUrl: https://cloud.knotree.com
  mcpAccessTtlSeconds: "3600"
  mcpRefreshTtlSeconds: "2592000"
  redisClusterImage: redis:7-alpine
  appServiceImagePullSecret: ghcr-cred
  appServiceDefaultRateLimitRpm: "60"
  htmlSiteDataDir: /var/lib/knotree/html-sites
  htmlNginxImage: nginxinc/nginx-unprivileged:1.27-alpine
  rustLog: info,knotree_api=debug

resources:
  requests:
    cpu: 1m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

migrations:
  enabled: false
  backoffLimit: 4
