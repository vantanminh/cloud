[package]
name = "knotree-api"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "form"] }
base64 = "0.22"
deunicode = "1.6"
dotenvy = "0.15"
futures-util = "0.3"
k8s-openapi = { version = "0.28", features = ["v1_33"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate", "derive", "macros"] }
sqlparser = "0.62"
subtle = "2.6"
thiserror = "2"
hmac = "0.12"
hex = "0.4"
time = { version = "0.3", features = ["serde", "macros"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
