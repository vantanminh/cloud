<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f10" media="(prefers-color-scheme: dark)" />
    <title>Knotree Cloud</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes.
      try {
        var t =
          localStorage.getItem("knotree-theme") ||
          localStorage.getItem("project-topology-dashboard-theme")
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        if (t === "dark") document.documentElement.classList.add("dark")
        document.documentElement.style.colorScheme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
