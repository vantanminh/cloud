name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: knotree-cloud-ci
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: API tests
        run: cargo test --manifest-path apps/api/Cargo.toml --locked

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Web tests
        run: |
          pnpm install --frozen-lockfile
          pnpm test:web

  build:
    needs: [test-api, test-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web assets
        run: |
          pnpm install --frozen-lockfile
          VITE_API_BASE_URL=https://cloud.knotree.com/api/v1 pnpm --dir apps/web build
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (pull CI images only)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes "${SSH_USER}@${SSH_HOST}" \
            "export PATH=/usr/local/bin:/usr/bin:\$PATH
             cd /home/code/cloud
             git fetch origin
             git checkout -B main ${{ github.sha }}
             chmod +x deploy/k3s-pull.sh
             GHCR_TOKEN=\"$GHCR_TOKEN\" GHCR_USERNAME='${{ github.actor }}' \
               KNOTREE_PROBE_DIR=/tmp/knotree-probes \
               ./deploy/k3s-pull.sh ${{ github.sha }} ${API_IMAGE} ${WEB_IMAGE}"
          mkdir -p probes
          scp -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}:/tmp/knotree-probes/healthz.json" \
            "${SSH_USER}@${SSH_HOST}:/tmp/knotree-probes/dashboard.html" \
            probes/ || true
          curl -fsSI --max-time 20 https://cloud.knotree.com || true
          curl -fsS --max-time 20 https://cloud.knotree.com/healthz || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-probes
          path: probes/
          if-no-files-found: ignore
