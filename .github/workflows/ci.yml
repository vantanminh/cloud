name: ci
permissions:
  contents: read
  packages: write
  actions: read
concurrency:
  group: knotree-cloud-ci
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web
jobs:
  deploy-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Fail deployment on missing GitHub configuration
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        K8S_CONFIG_JSON: ${{ vars.K8S_CONFIG_JSON }}
        K8S_SECRETS_JSON: ${{ secrets.K8S_SECRETS_JSON }}
        KNOTREE_REGISTRY_WEBHOOK_SECRET: ${{ secrets.KNOTREE_REGISTRY_WEBHOOK_SECRET }}
      run: |
        set -euo pipefail
        task_dir=$(mktemp -d)
        trap 'rm -rf "$task_dir"' EXIT
        python3 deploy/ci/runtime.py prepare "$task_dir"
        python3 - "$task_dir/runtime.json" >> "$GITHUB_OUTPUT" <<'PY'
        import json,sys
        print("api_url=" + json.load(open(sys.argv[1]))["config"]["VITE_API_BASE_URL"])
        PY
      id: config
    outputs:
      api_url: ${{ steps.config.outputs.api_url }}
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knotree
          POSTGRES_PASSWORD: knotree
          POSTGRES_DB: knotree
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U knotree -d knotree" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: API tests
      env:
        DATABASE_URL: postgres://knotree:knotree@localhost:5432/knotree
        CI: true
      run: cargo test --manifest-path apps/api/Cargo.toml --locked
  test-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Web tests
      run: |
        pnpm install --frozen-lockfile
        pnpm test:web
  build:
    needs:
    - test-api
    - test-web
    - deploy-preflight
    - deploy-contract-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build web assets
      run: |
        pnpm install --frozen-lockfile
        pnpm --dir apps/web build
      env:
        VITE_API_BASE_URL: ${{ needs.deploy-preflight.outputs.api_url }}
    - name: Build and push API image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/api/Dockerfile
        push: true
        tags: |
          ${{ env.API_IMAGE }}:${{ github.sha }}
          ${{ env.API_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
      id: api
    - name: Build and push web image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/web/Dockerfile
        push: true
        tags: |
          ${{ env.WEB_IMAGE }}:${{ github.sha }}
          ${{ env.WEB_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
      id: web
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Apply validated GitHub runtime and deploy CI images
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        K8S_CONFIG_JSON: ${{ vars.K8S_CONFIG_JSON }}
        K8S_SECRETS_JSON: ${{ secrets.K8S_SECRETS_JSON }}
        KNOTREE_REGISTRY_WEBHOOK_SECRET: ${{ secrets.KNOTREE_REGISTRY_WEBHOOK_SECRET }}
        API_DIGEST: ${{ needs.build.outputs.api_digest }}
        WEB_DIGEST: ${{ needs.build.outputs.web_digest }}
      run: bash deploy/ci/deliver.sh "${API_IMAGE}@${API_DIGEST}" "${WEB_IMAGE}@${WEB_DIGEST}"
    concurrency:
      group: cloud-production-runtime
      cancel-in-progress: false
  deploy-contract-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: python3 -m unittest discover -s deploy/ci -p "test_*.py"
'on':
  push:
    branches:
    - main
  pull_request: null
